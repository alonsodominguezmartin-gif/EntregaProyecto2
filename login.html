<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAcademia | Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <nav class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span>EduAcademia</span>
      </a>
      <button id="mobile-menu-btn" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="crear.html">Publicar Curso</a></li>
        <li><a href="login.html" class="active">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="auth-card">
      <h2 style="margin-bottom: 1.5rem; text-align: center;">Acceso al Portal</h2>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" data-validate="required|email" placeholder="tu@email.com">
          <div id="error-email" class="error-message" aria-live="polite"></div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" data-validate="required|min:6" placeholder="••••••••">
          <div id="error-password" class="error-message" aria-live="polite"></div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Acceder</button>
      </form>
      <p style="margin-top: 1rem; text-align: center; font-size: 0.875rem; color: var(--slate-500);">
        ¿No tienes cuenta? <a href="registro.html" style="color: var(--brand-600); font-weight: 600;">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 EduAcademia - Proyecto Interdisciplinar DAW Hito 2.</p>
  </footer>

  <script src="mockData.js"></script>
  <script src="main.js"></script>
</body>
</html>
