<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAcademia | Dashboard Principal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="header">
    <nav class="header-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span>EduAcademia</span>
      </a>
      <button id="mobile-menu-btn" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <ul id="nav-links" class="nav-links">
        <li><a href="index.html" class="active">Inicio</a></li>
        <li><a href="crear.html">Publicar Curso</a></li>
        <li><a href="login.html">Iniciar Sesión</a></li>
        <li><a href="registro.html" class="btn-primary">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Catálogo de Formaciones</h1>
      <p style="color: var(--slate-500);">Explora los cursos técnicos disponibles en el centro de estudios.</p>
    </section>

    <section class="filters-bar">
      <input type="text" id="search-input" class="form-control" placeholder="Buscar por título o descripción...">
      <select id="category-filter" class="form-control" style="max-width: 220px;">
        <option value="">Todas las categorías</option>
        <option value="Desarrollo Web">Desarrollo Web</option>
        <option value="Bases de Datos">Bases de Datos</option>
        <option value="Cloud">Cloud</option>
      </select>
      <button type="button" id="reset-filters-btn" class="btn-secondary" style="white-space: nowrap;">
        <i class="fa-solid fa-rotate-left"></i> Limpiar
      </button>
    </section>

    <div style="margin-bottom: 1rem; font-size: 0.875rem; color: var(--slate-500); font-weight: 600;">
      <span id="results-count"></span>
    </div>

    <section>
      <div id="courses-container" class="cards-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 EduAcademia - Proyecto Interdisciplinar DAW Hito 2.</p>
  </footer>

  <script src="mockData.js"></script>
  <script src="main.js"></script>
</body>
</html>
